<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="file:///home/moon/Projects/imoon07.github.io/css/alur.css">
</head><body>
<div id="x" class="alur" data-module="reverse-proxy" data-spec='{"module":"reverse-proxy","title":"RP","speed":1}'></div>
<pre id="report">pending</pre>
<script src="file:///home/moon/Projects/imoon07.github.io/js/alur/kit.js"></script>
<script src="file:///home/moon/Projects/imoon07.github.io/js/alur/cables.js"></script>

<script>
Alur.init();
setTimeout(function(){
  var svg=document.querySelector('#x svg');
  var paths=svg?svg.querySelectorAll('path').length:0;
  var nodes=svg?svg.querySelectorAll('.alur-node').length:0;
  var anim=svg?svg.querySelectorAll('animateMotion').length:0;
  document.getElementById('report').textContent=JSON.stringify({svg:!!svg,paths:paths,nodes:nodes,anim:anim});
},800);
</script></body></html>
