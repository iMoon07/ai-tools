<style>body{margin:0;background:#111827}</style></head><body class="article-page">
<div class="site"><main class="article-layout"><article class="article-column"><div class="prose" id="content"></div></article></article></main></div>
<pre id="report">pending</pre>
<script>
const MD="```topology\n"+"{\n  \"vertical\": true,\n  \"title\": \"The Flow\",\n  \"columns\": [[\"C\"], [\"P\"], [\"K\"], [\"G\"]],\n  \"nodes\": {\n    \"C\": [\"Customer\", \"Places an order\", \"customer\", \"actor\", \"https://en.wikipedia.org/wiki/Web_browser\"],\n    \"P\": [\"Waiter\", \"Takes the order and forwards it\", \"waiter\", \"process\", \"https://en.wikipedia.org/wiki/Web_server\"],\n    \"K\": [\"Chef\", \"Prepares the order\", \"cook\", \"process\", \"https://en.wikipedia.org/wiki/Runtime_system\", \"cook\"],\n    \"G\": [\"Pantry\", \"Stores ingredients\", \"warehouse\", \"store\", \"https://en.wikipedia.org/wiki/Database\"]\n  },\n  \"edges\": [[\"C\", \"P\", \"1\"], [\"P\", \"K\", \"2\"], [\"K\", \"G\", \"3\"], [\"G\", \"K\", \"4\", true], [\"K\", \"P\", \"5\", true], [\"P\", \"C\", \"6\", true]],\n  \"groups\": [[\"Eatery / Single Location\", [\"P\", \"K\", \"G\"], \"store\"]],\n  \"legend\": {\n    \"flow\": \"Order / request\",\n    \"back\": \"Return / response\"\n  },\n  \"facilities\": [\"In this place\", [\"store\", \"Eatery\"], [\"cooking-pot\", \"Kitchen\"], [\"utensils\", \"Dining area\"], [\"warehouse\", \"Storage\"]]\n}"+"\n```\n";
document.getElementById('content').innerHTML=DOMPurify.sanitize(marked.parse(MD,{gfm:true}),{ADD_TAGS:['figure','figcaption'],ADD_ATTR:['id','class','style','data-spec','aria-label','role','fill','r'],ALLOW_DATA_ATTR:true});
Topology.init();
setTimeout(function(){
 var r=document.querySelector('.topology');
 var bad=[],shapes=[];
 r.querySelectorAll('path,circle,rect,line,polyline,polygon,use,text').forEach(function(el){
   var c=getComputedStyle(el);var tag=el.tagName.toLowerCase();
   if(tag==='text') return;
   var paint=(c.fill!=='none'&&c.fill!=='rgba(0, 0, 0, 0)')?c.fill:null;
   var stroke=(c.stroke!=='none'&&c.stroke!=='rgba(0, 0, 0, 0)')?c.stroke:null;
   if(paint==='rgb(0, 0, 0)'||stroke==='rgb(0, 0, 0)') bad.push({tag:tag,cls:el.getAttribute('class')||'',fill:c.fill,stroke:c.stroke});
   shapes.push({tag:tag,cls:el.getAttribute('class')||'',fill:paint,stroke:stroke,op:c.opacity});
 });
 document.getElementById('report').textContent=JSON.stringify({bad:bad,shapes:shapes});
},900);
</script></body></html>
